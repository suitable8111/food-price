<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 장바구니 시세</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 경매장 시세판처럼 한 장의 가격표. 상단 요약(급등·급락) → 필터 줄 → 촘촘한 시세표 → 품목 상세 시트 */
:root {
  --bg: #f4f6f1;          /* 배추 겉잎빛이 살짝 도는 종이 */
  --surface: #ffffff;
  --ink: #18201a;
  --ink-2: #4b564d;
  --muted: #7d887f;
  --line: #dfe4dc;
  --accent: #2c6a3f;      /* 시금치 녹색 */
  --accent-soft: #e2eee4;
  --up: #c7322b;          /* 국내 시세 관례: 상승 빨강 */
  --up-soft: #fbe7e5;
  --down: #2357b5;        /* 하락 파랑 */
  --down-soft: #e4ecfa;
  --bar: #9fb8a5;
  --font-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121713; --surface: #1a211c; --ink: #e7ece6; --ink-2: #b4beb5; --muted: #869188;
    --line: #2b352e; --accent: #7cc490; --accent-soft: #213027;
    --up: #ff7a70; --up-soft: #3a1f1d; --down: #7ea8ff; --down-soft: #1c2740; --bar: #4f6b57;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121713; --surface: #1a211c; --ink: #e7ece6; --ink-2: #b4beb5; --muted: #869188;
  --line: #2b352e; --accent: #7cc490; --accent-soft: #213027;
  --up: #ff7a70; --up-soft: #3a1f1d; --down: #7ea8ff; --down-soft: #1c2740; --bar: #4f6b57;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 머리 */
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 5vw, 2.9rem); line-height: 1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand p { margin: 8px 0 0; color: var(--ink-2); max-width: 60ch; }
.stamp { display: grid; gap: 2px; text-align: right; font-size: 13px; color: var(--ink-2); }
.stamp strong { font-family: var(--font-num); font-size: 15px; color: var(--ink); font-weight: 500; }
.stamp a { color: var(--accent); }

/* 요약 */
.movers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.movers section { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; min-width: 0; }
.movers h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.movers h2 .tick { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
.movers ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.movers li button { width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; background: none; border: 0; padding: 6px 4px; border-radius: 4px; text-align: left; cursor: pointer; }
.movers li button:hover { background: var(--accent-soft); }
.movers .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.movers .pr { color: var(--ink-2); font-size: 13px; }

/* 필터 */
.filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 16px; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.search { margin-left: auto; flex: 1 1 200px; max-width: 280px; }
.search input { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; }

/* 표 */
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 14px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); border-bottom: 1px solid var(--ink); }
thead th button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; }
thead th button[data-dir]::after { content: attr(data-dir); margin-left: 3px; color: var(--accent); }
tbody tr { border-top: 1px solid var(--line); cursor: pointer; }
tbody tr:hover { background: var(--accent-soft); }
td.item { white-space: normal; min-width: 150px; }
td.item .cat { display: block; font-size: 12px; color: var(--muted); }
td.price { font-size: 16px; font-weight: 500; }
td.unit { color: var(--muted); font-size: 13px; }
.chg { display: inline-block; min-width: 64px; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
.chg.up { color: var(--up); background: var(--up-soft); }
.chg.down { color: var(--down); background: var(--down-soft); }
.chg.flat, .chg.na { color: var(--muted); }
.fc { display: inline-flex; gap: 6px; align-items: baseline; }
.fc .arrow.up { color: var(--up); } .fc .arrow.down { color: var(--down); } .fc .arrow.flat { color: var(--muted); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.foot { font-size: 13px; color: var(--muted); display: grid; gap: 4px; max-width: 75ch; }
.foot a { color: var(--accent); }

/* 상세 시트 */
.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 20; }
.sheet {
  position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(460px, 100%);
  background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 22px;
  display: grid; align-content: start; gap: 20px;
}
.sheet .close { justify-self: end; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.sheet h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; margin: 0; line-height: 1.1; text-wrap: balance; }
.sheet .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.big .num { font-size: 2rem; font-weight: 500; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.kv span { display: block; font-size: 12px; color: var(--muted); }
.sheet h4 { margin: 0 0 6px; font-size: 13px; letter-spacing: 0.04em; color: var(--ink-2); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.chart .lbl { fill: var(--ink); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -110%); }
.note { font-size: 13px; color: var(--ink-2); background: var(--bg); border-radius: 6px; padding: 10px 12px; }

@media (max-width: 680px) {
  .movers { grid-template-columns: minmax(0, 1fr); }
  .col-month, .col-year, .col-unit { display: none; }
  th, td { padding: 9px 8px; }
  .search { max-width: none; margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>오늘의 장바구니 시세</h1>
      <p>채소·과일·축산·수산물 소매가와 도매가를 매일 한 번 갱신합니다. 빨강은 상승, 파랑은 하락입니다.</p>
    </div>
    <div class="stamp">
      <span>조사 기준일 <strong id="dataDate">-</strong></span>
      <span>갱신 <span id="updatedAt" class="num">-</span></span>
      <span>출처 <a id="srcLink" href="https://www.kamis.or.kr" target="_blank" rel="noopener">KAMIS</a></span>
    </div>
  </header>

  <div class="movers">
    <section><h2><span class="tick" style="background:var(--up)"></span>전일 대비 많이 오른 품목</h2><ol id="risers"></ol></section>
    <section><h2><span class="tick" style="background:var(--down)"></span>전일 대비 많이 내린 품목</h2><ol id="fallers"></ol></section>
  </div>

  <div class="filters">
    <div class="seg" role="group" aria-label="시장 구분">
      <button type="button" id="cls-retail" data-cls="소매" aria-pressed="true">소매</button>
      <button type="button" id="cls-whole" data-cls="도매" aria-pressed="false">도매</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="품목 분류"></div>
    <label class="search"><input id="q" type="search" placeholder="품목 검색 (예: 배추, 삼겹살)" aria-label="품목 검색"></label>
  </div>

  <div class="board">
    <table>
      <thead><tr>
        <th><button data-sort="name">품목</button></th>
        <th class="col-unit">단위</th>
        <th><button data-sort="price">당일 가격</button></th>
        <th><button data-sort="change_day_pct">전일비</button></th>
        <th class="col-month"><button data-sort="change_month_pct">1개월비</button></th>
        <th class="col-year"><button data-sort="change_year_pct">1년비</button></th>
        <th><button data-sort="fc">다음 조사일 예측</button></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">시세를 불러오는 중입니다…</td></tr></tbody>
    </table>
  </div>

  <div class="foot">
    <span>가격은 KAMIS가 전국 주요 시장에서 조사한 평균가(원)입니다. 소매는 소비자 구매가, 도매는 상회 판매가 기준입니다.</span>
    <span>예측은 누적 이력과 1개월 추세로 계산한 단순 추정치로, 참고용입니다.</span>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<aside class="sheet" id="sheet" hidden aria-live="polite"></aside>

<script>
const CATS = [
  ["all", "전체"], ["200", "채소"], ["400", "과일"], ["500", "축산"],
  ["600", "수산"], ["100", "식량"], ["300", "특용"],
];
const state = { cls: "소매", cat: "all", q: "", sort: "change_day_pct", dir: -1, data: null, history: {} };
const won = n => n == null ? "-" : n.toLocaleString("ko-KR");
const dirOf = v => v == null ? "na" : v >= 0.5 ? "up" : v <= -0.5 ? "down" : "flat";
const chg = v => `<span class="chg num ${dirOf(v)}">${v == null ? "-" : (v > 0 ? "▲ " : v < 0 ? "▼ " : "") + Math.abs(v).toFixed(1) + "%"}</span>`;
const arrow = d => ({ up: "▲", down: "▼", flat: "–" })[d];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

async function load() {
  try {
    const [latest, history] = await Promise.all([
      fetch("data/latest.json", { cache: "no-store" }).then(r => r.json()),
      fetch("data/history.json", { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    ]);
    state.data = latest; state.history = history;
    document.getElementById("dataDate").textContent = latest.data_date;
    document.getElementById("updatedAt").textContent = latest.updated_at.replace("T", " ").slice(0, 16);
    render();
  } catch (e) {
    document.getElementById("rows").innerHTML = `<tr><td colspan="7" class="empty">시세 파일(data/latest.json)을 읽지 못했습니다. 수집 스크립트를 먼저 실행해 주세요.</td></tr>`;
  }
}

function pool() { return state.data.items.filter(i => i.cls === state.cls); }

function render() {
  const chips = document.getElementById("chips");
  chips.innerHTML = CATS.map(([code, label]) => {
    const n = code === "all" ? pool().length : pool().filter(i => i.category_code === code).length;
    return n ? `<button type="button" id="cat-${code}" data-cat="${code}" aria-pressed="${state.cat === code}">${label} <span class="num">${n}</span></button>` : "";
  }).join("");
  if (!pool().some(i => state.cat === "all" || i.category_code === state.cat)) state.cat = "all";

  const q = state.q.trim();
  let list = pool().filter(i => (state.cat === "all" || i.category_code === state.cat) && (!q || i.name.includes(q)));
  const key = state.sort;
  const val = i => key === "fc" ? i.forecast?.change_pct : i[key];
  list.sort((a, b) => {
    if (key === "name") return a.name.localeCompare(b.name, "ko") * state.dir;
    const x = val(a), y = val(b);
    if (x == null) return 1; if (y == null) return -1;
    return (x - y) * state.dir;
  });
  document.querySelectorAll("thead button").forEach(b => {
    if (b.dataset.sort === key) b.dataset.dir = state.dir < 0 ? "↓" : "↑"; else delete b.dataset.dir;
  });

  document.getElementById("rows").innerHTML = list.length ? list.map(i => `
    <tr data-id="${i.id}" tabindex="0">
      <td class="item">${esc(i.name)}<span class="cat">${esc(i.category)}${i.latest_day !== state.data.data_date ? ` · ${i.latest_day.slice(5)} 조사` : ""}</span></td>
      <td class="unit col-unit">${esc(i.unit)}</td>
      <td class="price num">${won(i.price)}</td>
      <td>${chg(i.change_day_pct)}</td>
      <td class="col-month">${chg(i.change_month_pct)}</td>
      <td class="col-year">${chg(i.change_year_pct)}</td>
      <td><span class="fc num"><span class="arrow ${i.forecast.direction}">${arrow(i.forecast.direction)}</span>${won(i.forecast.next)}</span></td>
    </tr>`).join("") : `<tr><td colspan="7" class="empty">조건에 맞는 품목이 없습니다. 검색어나 분류를 바꿔 보세요.</td></tr>`;

  const movers = pool().filter(i => i.change_day_pct != null);
  const li = i => `<li><button type="button" data-id="${i.id}"><span class="nm">${esc(i.name)}</span><span class="pr num">${won(i.price)}원/${esc(i.unit)}</span>${chg(i.change_day_pct)}</button></li>`;
  const up = movers.filter(i => i.change_day_pct > 0).sort((a, b) => b.change_day_pct - a.change_day_pct).slice(0, 5);
  const dn = movers.filter(i => i.change_day_pct < 0).sort((a, b) => a.change_day_pct - b.change_day_pct).slice(0, 5);
  document.getElementById("risers").innerHTML = up.map(li).join("") || `<li class="pr">오른 품목이 없습니다</li>`;
  document.getElementById("fallers").innerHTML = dn.map(li).join("") || `<li class="pr">내린 품목이 없습니다</li>`;
}

/* 비교 막대: 1년전 · 1개월전 · 전일 · 당일 · 예측 (0 기준선) */
function barChart(i) {
  const bars = [["1년 전", i.year_ago], ["1개월 전", i.month_ago], ["전일", i.prev_day], ["당일", i.price], ["예측", i.forecast.next]];
  const W = 400, H = 190, top = 22, bottom = 26, gap = 18;
  const max = Math.max(...bars.map(b => b[1] || 0)) * 1.08;
  const bw = (W - gap * (bars.length - 1)) / bars.length;
  const y = v => top + (H - top - bottom) * (1 - v / max);
  const base = H - bottom;
  const marks = bars.map(([label, v], k) => {
    const x = k * (bw + gap);
    const fill = label === "당일" ? "var(--accent)" : label === "예측" ? "none" : "var(--bar)";
    const stroke = label === "예측" ? `stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"` : "";
    const h = v ? base - y(v) : 0;
    const r = Math.min(4, h);
    const path = v ? `<path d="M${x},${base} V${y(v) + r} q0,-${r} ${r},-${r} H${x + bw - r} q${r},0 ${r},${r} V${base} Z" fill="${fill}" ${stroke}/>` : "";
    return `${path}
      <text class="lbl" x="${x + bw / 2}" y="${v ? y(v) - 6 : base - 6}" text-anchor="middle">${v ? won(v) : "자료 없음"}</text>
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${label}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="기간별 가격 비교">
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>${marks}</svg>`;
}

/* 누적 이력 선 그래프 + 예측 점선 */
function lineChart(i) {
  const s = (state.history[i.id] || []).map(([d, v]) => ({ d, v }));
  if (s.length < 2) return `<p class="note">일별 이력은 매일 수집하면서 쌓입니다. 현재 ${s.length}일치가 있어 그래프는 2일째부터 표시됩니다.</p>`;
  const W = 400, H = 170, L = 6, R = 50, T = 14, B = 22;
  const pts = [...s, { d: "예측", v: i.forecast.next, fc: true }];
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo || hi * 0.05) * 0.15; lo -= pad; hi += pad;
  const x = k => L + (W - L - R) * k / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const real = s.map((p, k) => `${k ? "L" : "M"}${x(k)},${y(p.v)}`).join(" ");
  const n = s.length - 1;
  const area = `${real} L${x(n)},${H - B} L${x(0)},${H - B} Z`;
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad].map(v => `
    <line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="${W - R + 6}" y="${y(v) + 4}">${won(Math.round(v))}</text>`).join("");
  const dots = pts.map((p, k) => `<circle cx="${x(k)}" cy="${y(p.v)}" r="${k === n ? 4.5 : 3}" fill="${p.fc ? "var(--surface)" : "var(--accent)"}" stroke="${p.fc ? "var(--accent)" : "var(--surface)"}" stroke-width="2"/>
    <rect x="${x(k) - 12}" y="${T}" width="24" height="${H - T - B}" fill="transparent" data-k="${k}"/>`).join("");
  return `<div class="chart" id="lineWrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 가격 추이">
    ${ticks}
    <path d="${area}" fill="var(--accent)" opacity="0.12"/>
    <path d="${real}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M${x(n)},${y(s[n].v)} L${x(n + 1)},${y(i.forecast.next)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="${L}" y="${H - 6}">${s[0].d.slice(5)}</text>
    <text x="${x(n)}" y="${H - 6}" text-anchor="middle">${s[n].d.slice(5)}</text>
    ${dots}</svg><div class="tip" id="tip" hidden></div></div>`;
}

function openSheet(id) {
  const i = state.data.items.find(x => x.id === id); if (!i) return;
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `
    <button type="button" class="close" id="closeSheet">닫기</button>
    <div><h3>${esc(i.name)}</h3><div class="meta">${esc(i.cls)} · ${esc(i.category)} · ${esc(i.unit)} 기준 · ${i.latest_day} 조사</div></div>
    <div class="big"><span class="num">${won(i.price)}원</span>${chg(i.change_day_pct)}</div>
    <div class="kv">
      <div><span>1개월 전</span><b class="num">${won(i.month_ago)}</b> ${chg(i.change_month_pct)}</div>
      <div><span>1년 전</span><b class="num">${won(i.year_ago)}</b> ${chg(i.change_year_pct)}</div>
      <div><span>다음 조사일 예측</span><b class="num">${won(i.forecast.next)}</b> ${chg(i.forecast.change_pct)}</div>
    </div>
    <div><h4>기간별 비교</h4><div class="chart">${barChart(i)}</div></div>
    <div><h4>일별 추이</h4>${lineChart(i)}</div>
    <p class="note">예측 방식: ${esc(i.forecast.method)}. 변동 폭은 당일가 기준 ±${i.forecast.method.includes("14일") ? 15 : 10}%로 제한합니다.</p>`;
  sheet.hidden = false; document.getElementById("sheetBg").hidden = false;
  document.getElementById("closeSheet").focus();
  const wrap = document.getElementById("lineWrap");
  if (wrap) {
    const s = state.history[i.id]; const tip = document.getElementById("tip");
    wrap.addEventListener("pointermove", e => {
      const k = e.target.dataset?.k; if (k == null) { tip.hidden = true; return; }
      const p = +k < s.length ? s[+k] : ["예측", i.forecast.next];
      const box = wrap.getBoundingClientRect(), r = e.target.getBoundingClientRect();
      tip.textContent = `${p[0]} · ${won(p[1])}원`; tip.hidden = false;
      tip.style.left = (r.left + r.width / 2 - box.left) + "px"; tip.style.top = (e.clientY - box.top) + "px";
    });
    wrap.addEventListener("pointerleave", () => tip.hidden = true);
  }
}
function closeSheet() { document.getElementById("sheet").hidden = true; document.getElementById("sheetBg").hidden = true; }

document.addEventListener("click", e => {
  const t = e.target.closest("button, tr[data-id]");
  if (!t) return;
  if (t.id === "closeSheet") return closeSheet();
  if (t.dataset.cls) { state.cls = t.dataset.cls; document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b === t)); return render(); }
  if (t.dataset.cat) { state.cat = t.dataset.cat; return render(); }
  if (t.dataset.sort) { state.dir = state.sort === t.dataset.sort ? -state.dir : (t.dataset.sort === "name" ? 1 : -1); state.sort = t.dataset.sort; return render(); }
  if (t.dataset.id) openSheet(t.dataset.id);
});
document.getElementById("sheetBg").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.key === "Enter" && e.target.matches("tr[data-id]")) openSheet(e.target.dataset.id);
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
load();
</script>
</body>
</html>
